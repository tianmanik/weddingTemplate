jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write      # <--- ini WAJIB
      pages: write         # <--- ini WAJIB
      contents: read       # <--- biasanya default, tapi sebaiknya tetap dicantumkan

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
